{% extends "base.html" %}{% block title %}Sign in — Dovetail{% endblock %}
{% block body %}
<h1>Dovetail</h1>
<p class="sub">Where to send a paper.</p>
<div class="card" style="max-width:26rem">
  <form method="post" action="/login">
    <p><label>Email<br><input name="email" type="email" required autofocus style="width:100%"></label></p>
    <p><label>Password<br><input name="password" type="password" required style="width:100%"></label></p>
    {% if error %}<p class="red">{{ error }}</p>{% endif %}
    <button type="submit">Sign in</button>
  </form>
</div>
<p class="note">Running standalone. Behind Borant ID there is nothing to type here:
the gateway vouches for you, or it does not.</p>
{% endblock %}
