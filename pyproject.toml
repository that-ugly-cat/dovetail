[project]
name = "dovetail"
version = "0.1.0"
description = "Finding the right journal for a paper, from title, abstract and word count"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "mcp[cli]>=1.2",
]

[project.scripts]
dovetail = "dovetail.cli:app"
dovetail-mcp = "dovetail.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dovetail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
